[versions]
agp = "8.7.3"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
retrofit = "2.9.0"
gson = "2.10.1"
persistent-cookie-jar = "1.0.1"
okhttp = "4.10.0"
volley = "1.2.1"
mlkit-barcode = "17.3.0"
dexter = "6.2.3"
camerax = "1.4.2"
zxing = "4.3.0"
threetenabp = "1.4.0"
itext = "7.2.0"
androidxCore = "1.16.0"
glide = "4.15.1"







[libraries]

junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
persistent-cookie-jar = { module = "com.github.franmontiel:PersistentCookieJar", version.ref = "persistent-cookie-jar" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" } # Tambahkan ini
volley = { module = "com.android.volley:volley", version.ref = "volley" }
zxing-android = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
threetenabp = { module = "com.jakewharton.threetenabp:threetenabp", version.ref = "threetenabp" }
dexter = { group = "com.karumi", name = "dexter", version.ref = "dexter" }
itext7-core = { module = "com.itextpdf:itext7-core", version.ref = "itext" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }